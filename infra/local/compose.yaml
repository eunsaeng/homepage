services:
  postgres:
    image: docker.io/library/postgres:18.6
    container_name: homepage-postgres
    environment:
      POSTGRES_DB: homepage
      POSTGRES_USER: homepage
      POSTGRES_PASSWORD: homepage
    ports:
      - "5432:5432"
    volumes:
      - homepage-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepage -d homepage"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  homepage-postgres-data: