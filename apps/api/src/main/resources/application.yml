spring:
  application:
    name: homepage-api
  profiles:
    default: local
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/homepage}
    username: ${DB_USERNAME:homepage}
    password: ${DB_PASSWORD:homepage}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/homepage}
    user: ${DB_USERNAME:homepage}
    password: ${DB_PASSWORD:homepage}

management:
  endpoints:
    web:
      exposure:
        include: health,info
homepage:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://127.0.0.1:3000
      - http://127.0.0.1:3001
